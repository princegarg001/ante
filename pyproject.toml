[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-recovery"
version = "0.1.0"
description = "A constrained-budget recovery agent for failed UPI Autopay / e-mandate debits"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # Wilcoxon signed-rank for the paired comparison. Declared explicitly: it was
    # present locally only because scikit-learn pulls it in, which masked the
    # missing declaration until CI ran on a clean environment.
    "scipy>=1.11",
    # Gradient boosting with monotonic constraints, isotonic calibration.
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["mandate_recovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exhaustive model-checking runs; deselect with -m 'not slow'",
]
