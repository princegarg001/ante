name: compliance

# The compliance argument is only worth something if it runs on every commit.
# A constraint layer verified once, by hand, on day 13 is a log file.

# Docs-only changes don't touch the decision path, and the mutation stage runs the
# full suite eleven times — no reason to spend that on a prose edit.
on:
  push:
    paths-ignore: ['docs/**', '*.md', 'package.json', 'package-lock.json']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'package.json', 'package-lock.json']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit and property tests
        run: python -m pytest -q -m "not slow"

      - name: Exhaustive constraint verification
        run: python -m mandate_recovery.constraints.modelcheck --days 3 --reach-days 6

      # The world must stay inside base rates taken from published market data.
      # A simulator that flatters the agent fails silently — the numbers look
      # better, not broken — so it is a gate rather than a report.
      - name: World calibration — is the simulator still honest?
        run: python -m mandate_recovery.sim.calibrate --seed 42

      # Spawns a worker, kills it uncatchably inside the in-doubt window, and
      # proves the restart performs no duplicate effect. A demo that only works
      # on one laptop is a liability.
      - name: Crash safety — real kill -9 mid-batch
        run: python -m demo.crash_demo

      - name: Mutation testing — does the suite have teeth?
        run: python -m tests.mutation
